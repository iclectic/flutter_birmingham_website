name: flutter_birmingham_website
description: "Flutter Birmingham community website — Flutter and Dart meetup in Birmingham, UK."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # Routing
  go_router: ^18.1.3

  # URL launching
  url_launcher: ^6.3.1

  # State management
  flutter_riverpod: ^3.5.0

  # Animations
  visibility_detector: ^0.4.0+2

  intl: ^0.20.3
  font_awesome_flutter: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/team/
    - assets/logos/

  fonts:
    - family: Google Sans
      fonts:
        - asset: assets/fonts/GoogleSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/GoogleSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/GoogleSans-Bold.ttf
          weight: 700
